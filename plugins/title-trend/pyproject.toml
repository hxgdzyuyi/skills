[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "title-trend"
version = "0.2.0"
description = "中文公众号标题的外部搜索需求与趋势参考，Python MCP Server + MCP Apps"
requires-python = ">=3.10"
dependencies = [
  "jieba==0.42.1",
  "mcp==1.30.0",
  "httpx==0.28.1",
  "keyring==25.7.0",
  "pydantic==2.12.5",
  "platformdirs==4.5.1",
  "filelock==3.20.3",
]

[project.scripts]
title-trend = "title_trend.cli:main"

[dependency-groups]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.14.13", "build==1.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/title_trend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
